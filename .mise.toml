# .mise.toml — tool version pinning for local development (§10 ALZ DX).
#
# Ensures every contributor uses the same tool versions as CI without
# needing a container. Install mise: https://mise.jdx.dev/
#
# Usage:
#   mise install      # first-time setup
#   mise use          # activate pinned versions in current shell

[tools]
terraform = "1.9.8"
python    = "3.13"

# Install pre-commit after activating the above tools
# then run: pre-commit install
