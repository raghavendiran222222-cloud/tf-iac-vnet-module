name: Feature request
description: Suggest a new input, output, or capability for the module
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the feature you'd like added. Be specific about
        the use case and how consumers of the module would benefit.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What limitation or gap are you hitting with the current module?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: |
        Describe the feature. If you have a suggested variable/output interface,
        sketch it out here.
      render: hcl

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you've tried, or other approaches that might solve the problem.

  - type: checkboxes
    id: breaking
    attributes:
      label: Breaking change?
      options:
        - label: This change would require a MAJOR version bump (changes existing variable types or removes outputs)

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: FDD section reference, related ADR, or other background.
