name: Bug report
description: Report an unexpected behavior or regression in the module
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much detail as possible.

  - type: dropdown
    id: module-version
    attributes:
      label: Module version
      description: Which version of tf-iac-vnet-module are you using?
      options:
        - latest
        - v1.x
        - v0.x
    validations:
      required: true

  - type: textarea
    id: terraform-version
    attributes:
      label: Terraform & provider versions
      description: Output of `terraform version`
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages or plan output.
      render: shell
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal module call that reproduces the issue.
      render: hcl
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context (screenshots, links, related issues).
