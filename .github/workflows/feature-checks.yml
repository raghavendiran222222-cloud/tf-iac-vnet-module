# ==============================================================================
# Workflow: Feature Branch Checks (feature-checks.yml)
#
# WHAT:   Static checks on every feature branch push — fmt, validate, tflint.
#         Provides fast feedback before a PR is opened.
#         No Azure credentials required — all checks are purely static.
#
# WHEN:   push to any branch except main, or manual workflow_dispatch.
#
# NO SECRETS REQUIRED — static checks only.
#
# SUPPLY CHAIN SECURITY — all Actions pinned by commit SHA (§06 ALZ):
#   Tags are mutable; SHA pins are immutable. Dependabot keeps them current.
# ==============================================================================

name: Feature Branch Checks

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: feature-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:

  validate:
    name: TF Format & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"

      # continue-on-error lets the annotation step below always run.
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive .
        continue-on-error: true

      # ::error:: emits an inline annotation visible on the commit diff.
      - name: Annotate fmt failure
        if: steps.fmt.outcome == 'failure'
        run: |
          echo "::error::terraform fmt check failed. Run 'make fmt' locally and commit the result."
          exit 1

      # -backend=false skips remote state; validate only checks schema and types.
      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      # tflint with azurerm ruleset — provider-aware linting per §09 Layer 1.
      - name: Setup tflint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.55.0

      - name: tflint Init
        run: tflint --init --config .tflint.hcl

      - name: tflint
        run: tflint --recursive --config "$(pwd)/.tflint.hcl"
