# ==============================================================================
# Workflow: Release Please (release.yml)
#
# WHAT:   Automates the full release lifecycle for this Terraform module using
#         release-please (googleapis/release-please-action@v4):
#
#         STEP 1 — On every push to main, release-please scans conventional
#                  commits and creates/updates a "Release PR" that:
#                    • Bumps the version in .release-please-manifest.json
#                    • Updates CHANGELOG.MD with categorised commit entries
#                    • Sets the PR title: "chore: release vX.Y.Z"
#
#         STEP 2 — When the Release PR is merged, release-please automatically:
#                    • Creates a git tag (e.g. v1.2.0)
#                    • Publishes a GitHub Release with the changelog as body
#
#         STEP 3 — Post-release job runs terraform-docs to verify README is
#                  current and prints the release summary to the run log.
#
# CONVENTIONAL COMMIT → VERSION BUMP MAPPING:
#   feat!: or BREAKING CHANGE footer  →  MAJOR bump  (v1.0.0 → v2.0.0)
#   feat:                              →  MINOR bump  (v1.0.0 → v1.1.0)
#   fix: / chore: / docs: / refactor:  →  PATCH bump  (v1.0.0 → v1.0.1)
#
# WHEN:   push to main branch only (fires after every PR merge).
#
# REQUIRED PERMISSIONS:
#   contents: write      — create tags and GitHub Releases
#   pull-requests: write — create and update the Release PR
#
# NO SECRETS REQUIRED — uses built-in GITHUB_TOKEN only.
#
# CONFIG FILES:
#   release-please-config.json       — release-please package config
#   .release-please-manifest.json    — current version tracking file
#
# SUPPLY CHAIN SECURITY — all Actions pinned by commit SHA (§06 ALZ):
#   Tags are mutable; SHA pins are immutable. Dependabot keeps them current.
# ==============================================================================

name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:

  # ----------------------------------------------------------------------------
  # Job 1: Release Please
  # Reads conventional commits on main and either:
  #   a) Creates / updates the Release PR (most pushes), or
  #   b) Tags + publishes the GitHub Release (when Release PR is merged).
  # ----------------------------------------------------------------------------
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name:        ${{ steps.release.outputs.tag_name }}
      version:         ${{ steps.release.outputs.version }}
      major:           ${{ steps.release.outputs.major }}
      minor:           ${{ steps.release.outputs.minor }}
      patch:           ${{ steps.release.outputs.patch }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file:   release-please-config.json
          manifest-file: .release-please-manifest.json
          token:         ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------------
  # Job 2: Post-release
  # Runs only when release-please has just published a real release (Step 2).
  # Verifies terraform-docs is current and logs the release summary.
  # ----------------------------------------------------------------------------
  post-release:
    name: Post-release validation
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout released tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Check out the exact tag that was just published, not main HEAD.
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      # terraform-docs verifies the README reflects the current variables and
      # outputs. If a contributor changed inputs without running `make docs`,
      # this step fails the post-release job and leaves an audit trail.
      - name: Verify terraform-docs is up to date
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          config-file:     .terraform-docs.yml
          output-method:   inject
          fail-on-diff:    true
          git-push:        false

      - name: Release summary
        run: |
          {
            echo "### Released ${{ needs.release-please.outputs.tag_name }}"
            echo ""
            echo "| Field   | Value |"
            echo "|---------|-------|"
            echo "| Version | \`${{ needs.release-please.outputs.version }}\` |"
            echo "| Major   | \`${{ needs.release-please.outputs.major }}\` |"
            echo "| Minor   | \`${{ needs.release-please.outputs.minor }}\` |"
            echo "| Patch   | \`${{ needs.release-please.outputs.patch }}\` |"
            echo ""
            echo "Consumers can pin to this release:"
            echo "\`\`\`hcl"
            echo "source = \"git::https://github.com/bdtmsd/tf-iac-vnet-module.git?ref=${{ needs.release-please.outputs.tag_name }}\""
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
