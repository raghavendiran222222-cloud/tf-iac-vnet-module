# ==============================================================================
# Workflow: Release (release.yml)
#
# WHAT:   Creates a GitHub Release when a semantic version tag is pushed.
#         This is the "ship" event for a Terraform module repo — equivalent to
#         `terraform apply` in a live infrastructure repo. Consumers pin to a
#         specific tag (e.g. ?ref=v1.2.0) so every release is an immutable
#         artifact that downstream teams can safely reference.
#
# WHEN:   push of a tag matching v*.*.* (e.g. v1.0.0, v1.2.3)
#
#         To publish a new module version:
#           git tag v1.1.0
#           git push origin v1.1.0
#
# REQUIRED SECRETS:
#   GITHUB_TOKEN - built-in, no configuration needed. GitHub injects it
#                  automatically with write access to create releases.
#
# RELEASE NOTES: auto-generated from PR titles and commit messages merged
#   since the previous tag using GitHub's built-in --generate-notes flag.
# ==============================================================================

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # required to create a GitHub Release

jobs:

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history needed so --generate-notes can diff against the
          # previous tag to build accurate release notes.
          fetch-depth: 0

      # gh release create uses the built-in GITHUB_TOKEN — no extra secret needed.
      # --generate-notes compares this tag to the previous one and auto-builds
      # a changelog from merged PR titles.
      # --verify-tag ensures the tag is a valid annotated or lightweight tag
      # already present on the remote before the release is created.
      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
