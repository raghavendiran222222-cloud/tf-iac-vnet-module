# ==============================================================================
# Workflow: PR Checks (pr-checks.yml)
#
# WHAT:   Four required status checks that must pass before any PR merges
#         into main, enforcing the FDD §2.2.4 quality gate:
#           1. TF Format & Validate — fmt, validate, tflint (AzureRM ruleset)
#           2. HCP Terraform Speculative Plan — local plan against examples/basic
#              + Checkov security scan posted as PR comment
#           3. TF-test — pytest/tftest plan-based unit tests
#
# WHEN:   pull_request to main, or manual workflow_dispatch.
#         In-progress runs for the same PR are cancelled on new pushes.
#
# AUTHENTICATION — OIDC federation (§05 ALZ best practices):
#   azure/login@v2 exchanges a GitHub OIDC JWT for a short-lived Entra token.
#   ARM_CLIENT_SECRET is never used or stored anywhere.
#   Federated credential subject for PR jobs:
#     repo:bdtmsd/tf-iac-vnet-module:pull_request
#
# REQUIRED VARIABLES (Settings > Secrets and variables > Variables):
#   ARM_CLIENT_ID       - Service Principal client ID   (not sensitive)
#   ARM_TENANT_ID       - Entra ID tenant ID            (not sensitive)
#   ARM_SUBSCRIPTION_ID - Azure subscription ID         (not sensitive)
#
# NO SECRETS REQUIRED — ARM_CLIENT_SECRET must not be stored anywhere.
#
# STATUS CHECK NAMES (must match Branch Protection rules exactly):
#   "TF Format & Validate"
#   "HCP Terraform Speculative Plan"
#   "TF-test"
#
# SUPPLY CHAIN SECURITY — all Actions pinned by commit SHA (§06 ALZ):
#   Tags are mutable; SHA pins are immutable. Dependabot keeps them current.
# ==============================================================================

name: PR Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write        # required — lets the runner request an OIDC JWT from GitHub
  security-events: write # required — upload Checkov SARIF to GitHub Security tab

env:
  TF_IN_AUTOMATION: "true"
  TF_CLI_ARGS_plan: "-no-color"

jobs:

  # ----------------------------------------------------------------------------
  # Job 0: Detect whether Azure variables are configured.
  # Downstream jobs skip cleanly instead of failing when vars are not yet set.
  # ----------------------------------------------------------------------------
  check-secrets:
    name: Check Azure Credentials
    runs-on: ubuntu-latest
    outputs:
      has-azure-creds: ${{ steps.check.outputs.has-azure-creds }}
    steps:
      - name: Detect credentials
        id: check
        env:
          ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
        run: |
          if [[ -n "$ARM_CLIENT_ID" ]]; then
            echo "has-azure-creds=true"  >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ARM_CLIENT_ID variable not set — speculative-plan and tftest will be skipped."
            echo "has-azure-creds=false" >> "$GITHUB_OUTPUT"
          fi

  # ----------------------------------------------------------------------------
  # Job 1: TF Format & Validate
  # Static checks per ALZ §09 Layer 1 — runs on every commit, no Azure auth.
  # Includes tflint with the AzureRM ruleset for provider-aware linting.
  # ----------------------------------------------------------------------------
  validate:
    name: TF Format & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive .

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      # tflint with azurerm ruleset catches deprecated args and AzureRM-specific
      # issues that terraform validate cannot see (§09 Layer 1).
      - name: Setup tflint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.55.0

      - name: tflint Init
        run: tflint --init --config .tflint.hcl

      - name: tflint
        run: tflint --recursive --config "$(pwd)/.tflint.hcl"

  # ----------------------------------------------------------------------------
  # Job 2: HCP Terraform Speculative Plan
  # Local plan against examples/basic with -backend=false, followed by a
  # Checkov security scan (§09 Layer 2 — policy-as-code on the plan).
  # Plan + scan results posted as collapsible PR comments.
  #
  # Authentication: azure/login@v2 (OIDC) + ARM_USE_CLI=true per §05.
  # This job name is a required Branch Protection status check.
  # ----------------------------------------------------------------------------
  speculative-plan:
    name: HCP Terraform Speculative Plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate, check-secrets]
    if: needs.check-secrets.outputs.has-azure-creds == 'true'

    env:
      # IDs are not sensitive — stored as vars (§05 ALZ best practice)
      ARM_CLIENT_ID:       ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID:       ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      # Use Azure CLI auth so the azurerm provider picks up the token from
      # the az login session established by azure/login@v2 above.
      ARM_USE_CLI:         "true"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # OIDC login per ALZ §05 — no client secret, short-lived token only.
      # Federated credential subject: repo:bdtmsd/tf-iac-vnet-module:pull_request
      - name: Azure Login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id:       ${{ vars.ARM_CLIENT_ID }}
          tenant-id:       ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      # Redirect module source to local ../../ — tag v1.0.0 may not exist yet.
      - name: Override module source to local path
        run: |
          cat > examples/basic/override.tf << 'EOF'
          module "spoke_vnet" {
            source = "../../"
          }
          EOF

      - name: Terraform Init
        working-directory: examples/basic
        run: terraform init -backend=false

      - name: Terraform Plan
        id: plan
        working-directory: examples/basic
        run: |
          terraform plan -backend=false -no-color \
            -var "subscription_id=$ARM_SUBSCRIPTION_ID" \
            -out=tfplan \
            2>&1 | tee "${{ github.workspace }}/plan_output.txt"
          terraform show -json tfplan > "${{ github.workspace }}/tfplan.json"
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # Checkov scans the plan JSON for security issues — §09 Layer 2.
      # SARIF output uploads findings to the GitHub Security tab.
      # soft_fail: false per ALZ §09 anti-pattern — always surface findings.
      - name: Checkov security scan
        id: checkov
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # v12.3114.0
        with:
          file: tfplan.json
          framework: terraform_plan
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: false
        continue-on-error: true

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: checkov.sarif
        continue-on-error: true

      - name: Post Plan Output to PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PLAN_EXITCODE:    ${{ steps.plan.outputs.exitcode }}
          CHECKOV_OUTCOME:  ${{ steps.checkov.outcome }}
        with:
          script: |
            const fs   = require('fs');
            const path = require('path');

            const raw = fs.readFileSync(
              path.join(process.env.GITHUB_WORKSPACE, 'plan_output.txt'), 'utf8'
            );

            const MAX    = 65000;
            const output = raw.length > MAX
              ? raw.slice(0, MAX) + '\n\n… output truncated — see the full run log'
              : raw;

            const exitCode = process.env.PLAN_EXITCODE;
            const planStatus = exitCode === '0' ? '✅ Plan succeeded' : '❌ Plan failed';
            const checkovStatus = process.env.CHECKOV_OUTCOME === 'success'
              ? '✅ Checkov clean'
              : '⚠️ Checkov findings (see Security tab)';

            const body = [
              `## HCP Terraform Speculative Plan — ${planStatus} · ${checkovStatus}`,
              '',
              '> Plan ran locally against `examples/basic` with `-backend=false`. Security findings in the GitHub Security tab.',
              '',
              '<details><summary>Click to expand plan output</summary>',
              '',
              '```hcl',
              output,
              '```',
              '</details>',
              '',
              `> Workflow \`${{ github.workflow }}\` · [Run #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const c of comments) {
              if (c.user.type === 'Bot' &&
                  c.body.startsWith('## HCP Terraform Speculative Plan')) {
                await github.rest.issues.deleteComment({
                  owner:      context.repo.owner,
                  repo:       context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if plan failed
        if: steps.plan.outputs.exitcode != '0'
        run: |
          echo "::error::Terraform plan failed with exit code ${{ steps.plan.outputs.exitcode }}."
          exit 1

  # ----------------------------------------------------------------------------
  # Job 3: TF-test
  # pytest/tftest plan-based unit tests (§09 Layer 2 — module test coverage).
  # Authentication: same azure/login@v2 OIDC pattern as speculative-plan.
  # This job name is a required Branch Protection status check.
  # ----------------------------------------------------------------------------
  tftest:
    name: TF-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate, check-secrets]
    if: needs.check-secrets.outputs.has-azure-creds == 'true'

    env:
      ARM_CLIENT_ID:          ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID:          ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID:    ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_USE_CLI:            "true"
      TF_VAR_subscription_id: ${{ vars.ARM_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Azure Login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id:       ${{ vars.ARM_CLIENT_ID }}
          tenant-id:       ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install pytest tftest

      - name: Override module source to local path
        run: |
          cat > examples/basic/override.tf << 'EOF'
          module "spoke_vnet" {
            source = "../../"
          }
          EOF

      - name: Run pytest / tftest
        id: test
        run: |
          set +e
          pytest tests/ -v --no-header --tb=short 2>&1 | tee "${{ github.workspace }}/test_output.txt"
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e
        continue-on-error: true

      - name: Post Test Results to PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs   = require('fs');
            const path = require('path');

            const raw = fs.readFileSync(
              path.join(process.env.GITHUB_WORKSPACE, 'test_output.txt'), 'utf8'
            );

            const MAX    = 65000;
            const output = raw.length > MAX
              ? raw.slice(0, MAX) + '\n\n… output truncated — see the full run log'
              : raw;

            const code   = '${{ steps.test.outputs.exit_code }}';
            const status = code === '0' ? '✅ All tests passed' : '❌ Tests failed';

            const body = [
              `## TF-test (pytest) — ${status}`,
              '',
              '<details><summary>Click to expand test output</summary>',
              '',
              '```',
              output,
              '```',
              '</details>',
              '',
              `> Workflow \`${{ github.workflow }}\` · [Run #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const c of comments) {
              if (c.user.type === 'Bot' && c.body.startsWith('## TF-test (pytest)')) {
                await github.rest.issues.deleteComment({
                  owner:      context.repo.owner,
                  repo:       context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if tests failed
        if: steps.test.outputs.exit_code != '0'
        run: |
          echo "::error::pytest/tftest tests failed — review the output above."
          exit 1
