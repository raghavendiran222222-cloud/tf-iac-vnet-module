# ==============================================================================
# Workflow: Terraform Apply (apply.yml)
#
# WHAT:   Runs `terraform apply` in HCP Terraform after every merge to main.
#         Execution is paused at the "production" GitHub Environment gate,
#         which requires manual approval from designated reviewers before any
#         infrastructure change is made.
#
# WHEN:   push to main branch only (fires after a PR is merged).
#         In-progress applies are never cancelled — partial applies can leave
#         infrastructure in an inconsistent state.
#
# REQUIRED SECRETS (GitHub Settings > Secrets and variables > Actions):
#   TF_API_TOKEN        - HCP Terraform API token (team token with write access)
#   ARM_CLIENT_ID       - Azure Service Principal client ID
#   ARM_CLIENT_SECRET   - Azure Service Principal client secret
#   ARM_TENANT_ID       - Azure Entra ID tenant ID
#   ARM_SUBSCRIPTION_ID - Azure subscription ID
#
# APPROVAL GATE — how to configure:
#   1. GitHub Settings > Environments > New environment > name: "production"
#   2. Enable "Required reviewers" and add at least 2 reviewers (FDD §2.2.4).
#   3. Optionally restrict deployments to the main branch only.
#   The apply job will not start until all required reviewers approve the run.
#
# FUTURE:  Infracost cost diff will be gated here (pre-apply) once approved.
# ==============================================================================

name: Terraform Apply

on:
  push:
    branches:
      - main

# Prevent concurrent applies against the same workspace. cancel-in-progress is
# false because interrupting a running apply risks partial resource creation.
concurrency:
  group: apply-main
  cancel-in-progress: false

permissions:
  contents: read  # checkout
  id-token: write # reserved for future OIDC expansion

env:
  TF_IN_AUTOMATION: "true" # suppresses interactive prompts in all terraform calls

jobs:

  # ----------------------------------------------------------------------------
  # Terraform Apply
  # The "environment: production" declaration causes GitHub Actions to pause
  # here and wait for required reviewer approval before executing any step.
  # Configure reviewers at: Settings > Environments > production > Required reviewers
  # ----------------------------------------------------------------------------
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    # ARM_* env vars authenticate the Azure Service Principal to the azurerm
    # provider. GitHub Actions automatically masks these values in all log output.
    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # cli_config_credentials_token writes ~/.terraformrc so terraform init
      # can reach the HCP Terraform workspace without exposing the token in logs.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.1"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      # -auto-approve is intentional: the human approval gate is enforced by the
      # GitHub Environment above, not by an interactive CLI prompt. This is the
      # correct pattern for unattended CI/CD applies (FDD §2.2.4).
      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color
